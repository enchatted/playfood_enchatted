<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>" />
    <title>Playfood Archipelago</title>
    <!-- Dialogue face draws on canvas from the very first frames; preload so
         the typewriter text never flashes in the fallback font. -->
    <link rel="preload" href="/fonts/Comfortaa.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/Inter-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: var(--pf-font-body), system-ui, sans-serif;
        background: var(--pf-bg);
        color: var(--pf-text);
        overflow: hidden;
      }
      html, body { overscroll-behavior: none; }
      #root { width: 100%; height: 100vh; height: 100dvh; }

      /* Wave animation */
      @keyframes wave {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }

      /* Gentle float for islands */
      @keyframes float {
        0%, 100% { transform: translate(-50%, -50%) translateY(0); }
        50% { transform: translate(-50%, -50%) translateY(-8px); }
      }

      /* Bounce on hover */
      @keyframes bounce {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }

      /* Pulse for CTA buttons */
      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(255, 112, 67, 0.4); }
        50% { box-shadow: 0 0 0 12px rgba(255, 112, 67, 0); }
      }

      /* Confetti burst */
      @keyframes confetti-fall {
        0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
        100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
      }

      /* Slide up entrance */
      @keyframes slide-up {
        0% { transform: translateY(30px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
