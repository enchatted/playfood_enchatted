<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAYFOOD: Source</title>
<style>
  /* PLAYFOOD «Αρχείο Εξερευνητών» — ίδια pixel-art παλέτα/τεχνική με το Grand Finale
     certificate (CertificateScreen.jsx): βαθύ ναυτικό stage, περγαμηνές κάρτες, stepped
     box-shadow πλαίσια, σκληρά bevels, ΚΑΘΟΛΟΥ border-radius / soft shadow / smooth gradient. */
  :root{
    /* brand χρώματα (brandColors.js / Brand Guideline PDF p.09-10) — κρατιούνται για το --accent */
    --pf-green:#6DB06C; --pf-green-dk:#3E7B3D; --pf-orange:#E07F37; --pf-red:#D36244;
    --pf-blue:#235FB7; --pf-purple:#533F8B; --pf-cream:#FBF6C9; --pf-yellow-soft:#F7E1A4;
    --pf-yellow-green:#E0E07E; --pf-pink:#E5BDD1;
    /* pixel-art παλέτα (PAL του certificate) */
    --paper:#E9D29A; --paper-lite:#F2E2B6; --cream:#FFF8E1;
    --ink:#3A2D1C; --ink-soft:rgba(58,45,28,.72); --ink-faint:rgba(58,45,28,.55);
    --gold:#C9A24B; --gold-lite:#E7CC84; --gold-dark:#8A6A2B;
    --wood:#6B4E2E; --wood-deep:#4C3826; --outline:#241608;
    --stage:#0E3A40;
    --accent:var(--pf-green); /* το JS το αλλάζει ανά πηγή */
  }
  *{box-sizing:border-box}
  body{
    margin:0; color:var(--ink); line-height:1.65;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background-color:var(--stage);
    /* διακριτικό retro dither (σκακιέρα 8px) πάνω στο βαθύ φόντο — όπως το certificate */
    background-image:repeating-conic-gradient(rgba(255,255,255,.035) 0% 25%, rgba(0,0,0,.05) 0% 50%);
    background-size:8px 8px;
    image-rendering:pixelated;
  }

  /* ── in-game top bar: συμπαγές ξύλο, σκληρό bevel, χωρίς border-radius ── */
  .top{
    position:relative; z-index:5;
    background:var(--wood-deep);
    padding:12px 22px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    box-shadow:inset 0 3px 0 rgba(255,255,255,.12), inset 0 -5px 0 rgba(0,0,0,.4), 0 5px 0 var(--outline);
  }
  .logo{
    color:var(--cream); font-weight:900; letter-spacing:4px; font-size:18px;
    text-shadow:3px 3px 0 var(--outline);
  }
  .logo .leaf{display:inline-block; transform:translateY(1px); margin-right:7px}
  .backbtn{
    margin-left:auto; color:var(--cream); font-size:12px; font-weight:800; letter-spacing:.5px;
    cursor:pointer; background:var(--wood); border:0; border-radius:0; padding:8px 14px;
    font-family:inherit; display:none;
    box-shadow:inset 2px 2px 0 rgba(255,255,255,.2), inset -2px -2px 0 rgba(0,0,0,.4), 0 4px 0 var(--outline);
  }
  .backbtn:hover{background:#7d5c38}
  .backbtn:active{transform:translateY(4px); box-shadow:inset 2px 2px 0 rgba(255,255,255,.2), inset -2px -2px 0 rgba(0,0,0,.4), 0 0 0 2px var(--outline)}

  main{max-width:880px; margin:30px auto 60px; padding:0 22px}

  /* ── hero: κάρτα-ευρετήριο με chunky stepped-corner pixel frame (outline→gold→wood) ── */
  .hero{
    position:relative; background:var(--paper);
    border:4px solid var(--outline); border-radius:0;
    margin:14px 16px 44px; padding:26px 30px 22px; image-rendering:pixelated;
    box-shadow:
      -4px 0 0 var(--outline),4px 0 0 var(--outline),0 -4px 0 var(--outline),0 4px 0 var(--outline),
      -8px 0 0 var(--gold),8px 0 0 var(--gold),0 -8px 0 var(--gold),0 8px 0 var(--gold),
      -12px 0 0 var(--wood-deep),12px 0 0 var(--wood-deep),0 -12px 0 var(--wood-deep),0 12px 0 var(--wood-deep),
      inset 4px 4px 0 rgba(255,250,235,.35), inset -4px -4px 0 rgba(120,80,30,.18);
  }
  .hero .kicker{font-size:11px; font-weight:900; letter-spacing:2.5px; text-transform:uppercase; color:var(--gold-dark)}
  /* main title: καθαρό espresso, ΧΩΡΙΣ retro text-shadow (η ανάγνωση πρώτη) */
  .hero h1{
    margin:10px 0 6px; font-weight:800;
    font-size:clamp(25px,4.5vw,37px); line-height:1.16; letter-spacing:-.4px;
    color:#2E2620;
  }
  .hero .pub{font-size:14px; color:var(--ink-soft); margin-bottom:16px; font-weight:600}
  .chips{display:flex; gap:11px; flex-wrap:wrap; align-items:center}
  /* chips = in-game pixel badges/buttons: συμπαγή, σκληρό bevel, χωρίς border-radius */
  .chip{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:800; letter-spacing:.3px;
    border:3px solid var(--outline); border-radius:0; padding:6px 12px; background:var(--cream); color:var(--ink);
    box-shadow:inset 2px 2px 0 rgba(255,255,255,.5), inset -2px -2px 0 rgba(120,80,30,.16), 0 3px 0 var(--outline);
  }
  .chip.ok{background:var(--pf-green-dk); color:#fff;
    box-shadow:inset 2px 2px 0 rgba(255,255,255,.28), inset -2px -2px 0 rgba(0,0,0,.28), 0 3px 0 var(--outline)}
  .chip.game{background:var(--accent); color:#fff;
    box-shadow:inset 2px 2px 0 rgba(255,255,255,.28), inset -2px -2px 0 rgba(0,0,0,.28), 0 3px 0 var(--outline)}
  a.chip.link{background:var(--gold); color:var(--ink); border-color:var(--outline); text-decoration:none;
    box-shadow:inset 2px 2px 0 var(--gold-lite), inset -2px -2px 0 var(--gold-dark), 0 4px 0 var(--outline)}
  a.chip.link:hover{background:var(--gold-lite)}
  a.chip.link:active{transform:translateY(4px);
    box-shadow:inset 2px 2px 0 var(--gold-lite), inset -2px -2px 0 var(--gold-dark), 0 0 0 2px var(--outline)}
  .hero .corner{position:absolute; top:-14px; right:20px; font-size:26px}

  /* ── "γιατί" pinned note (pixel, χωρίς rotation) ── */
  .why{
    background:var(--pf-yellow-soft); border:3px solid var(--outline); border-radius:0;
    box-shadow:inset 2px 2px 0 rgba(255,255,255,.45), inset -2px -2px 0 rgba(120,80,30,.16), 6px 6px 0 var(--outline);
    padding:17px 22px; margin:0 18px 10px; font-size:15.5px; line-height:1.66; color:#2E2620;
  }
  .why b{display:block; font-size:11px; letter-spacing:2px; text-transform:uppercase; margin-bottom:6px; color:var(--gold-dark)}

  .guide{font-size:13px; color:rgba(255,248,225,.85); margin:18px 18px 26px; text-align:center}
  .guide .star{color:var(--gold-lite); font-weight:900}

  /* ── document pages: σκληρό pixel πλαίσιο γύρω, αλλά ΚΑΘΑΡΟ ανοιχτό φόντο μέσα για ανάγνωση ── */
  .page{
    position:relative; background:#FDFBF7;
    border:3px solid var(--outline); border-radius:0;
    margin:0 18px 22px 54px; padding:18px 26px 18px 28px;
    box-shadow:6px 6px 0 var(--wood-deep); image-rendering:pixelated;
  }
  .page::before{ /* spine, σαν περιθώριο τετραδίου */
    content:""; position:absolute; left:11px; top:8px; bottom:8px; width:3px; background:var(--gold-dark);
  }
  .page .tab{
    position:absolute; left:-54px; top:8px; width:40px; height:40px;
    display:flex; align-items:center; justify-content:center;
    background:var(--accent); color:#fff; font-weight:900; font-size:15px;
    border:3px solid var(--outline); border-radius:0;
    font-family:ui-monospace,Menlo,Consolas,monospace;
    box-shadow:inset 2px 2px 0 rgba(255,255,255,.3), inset -2px -2px 0 rgba(0,0,0,.32), 0 4px 0 var(--outline);
  }
  /* reading text: μεγαλύτερο, πιο αραιό, σκούρο για μέγιστη αντίθεση πάνω στο ανοιχτό φόντο */
  .page p{margin:0; font-family:Georgia,"Times New Roman",serif; font-size:17.5px; line-height:1.72; color:#26201A}

  /* fact card = "μπαίνει στο παιχνίδι": συμμετρικό stepped pixel frame στο accent + ολόλευκο φόντο */
  .page.fact{
    background:#FFFFFF; border:3px solid var(--outline);
    box-shadow:
      -3px 0 0 var(--outline),3px 0 0 var(--outline),0 -3px 0 var(--outline),0 3px 0 var(--outline),
      -6px 0 0 var(--accent),6px 0 0 var(--accent),0 -6px 0 var(--accent),0 6px 0 var(--accent);
  }
  .page.fact .tab{background:var(--gold); color:var(--ink)}
  .page.fact .tab::after{content:"★"; position:absolute; top:-13px; right:-10px; font-size:16px; color:var(--gold); text-shadow:1px 1px 0 var(--outline)}
  .usedtag{
    display:inline-flex; align-items:center; gap:6px; background:var(--accent); color:#fff;
    font-size:11px; font-weight:900; letter-spacing:.6px; border-radius:0; padding:5px 11px; margin-bottom:11px;
    border:2px solid var(--outline); box-shadow:0 3px 0 var(--outline);
  }
  .notfound{
    background:var(--paper); border:4px solid var(--outline); border-radius:0; padding:28px; text-align:center; color:var(--ink); margin:0 18px;
    box-shadow:
      -4px 0 0 var(--outline),4px 0 0 var(--outline),0 -4px 0 var(--outline),0 4px 0 var(--outline),
      -8px 0 0 var(--gold),8px 0 0 var(--gold),0 -8px 0 var(--gold),0 8px 0 var(--gold);
  }
  .notfound code{background:var(--wood-deep); color:var(--cream); padding:2px 7px; border-radius:0}

  footer{
    max-width:880px; margin:0 auto; padding:8px 22px 56px; color:rgba(255,248,225,.7); font-size:12.5px; text-align:center;
  }
  footer .mandate{display:inline-block; border-top:3px solid var(--gold-dark); padding-top:16px}

  @media print{
    body{background:#fff !important; background-image:none !important; color:#222}
    .top,.backbtn{display:none !important}
    .hero,.page,.page.fact,.notfound,.why{box-shadow:none !important}
    .hero h1{text-shadow:none}
    .guide,footer{color:#444 !important}
  }
</style>
</head>
<body>
<div class="top">
  <span class="logo"><span class="leaf">🌱</span>PLAYFOOD</span>
  <button class="backbtn" id="backbtn" onclick="window.close()">← Back to the game</button>
</div>
<main>
  <div class="hero">
    <span class="corner">🔖</span>
    <div class="kicker">📖 The Explorers' Archive</div>
    <h1 id="title">…</h1>
    <div class="pub" id="pub"></div>
    <div class="chips" id="meta"></div>
  </div>
  <div id="whybox"></div>
  <div class="guide" id="guide"></div>
  <div id="main"></div>
</main>
<footer>
  <span class="mandate">📖 From the PLAYFOOD source library. Every excerpt is verbatim and appears exactly as published by its original source.<br>PLAYFOOD · ENCHATTED P.C. · EU Grant Agreement No. 101196354 🇪🇺</span>
</footer>
